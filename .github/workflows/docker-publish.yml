name: Docker images

# Builds the API and web images for linux/amd64 and linux/arm64 on native
# runners and publishes them to ghcr.io/<repository owner>/open-sunsama-{api,web}
# when a v* tag is pushed. Also to Docker Hub when the DOCKERHUB_USERNAME and
# DOCKERHUB_TOKEN secrets are set. Pull requests that touch the images build
# them without pushing. A fork publishes to its own owner's namespace.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Exact version to tag, e.g. 1.2.4 (never moves 1.2 or latest). Empty: sha-<commit> only"
        required: false
        default: ""
  pull_request:
    paths:
      - Dockerfile.api
      - Dockerfile.web
      - docker-compose.yml
      - apps/web/server.ts
      - .github/workflows/docker-publish.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PUSH: ${{ github.event_name != 'pull_request' }}
  # v1.2.3 tag push: 1.2.3, 1.2, latest and sha-<commit> (pre-releases skip 1.2
  # and latest). A manual run tags only the exact version it is given plus
  # sha-<commit>, so re-publishing an old version never moves 1.2 or latest.
  IMAGE_TAGS: |
    type=semver,pattern={{version}},enable=${{ github.event_name == 'push' }}
    type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'push' }}
    type=semver,pattern={{version}},value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
    type=sha
  # latest=auto adds latest for any stable semver tag, so only tag pushes get it
  LATEST: ${{ github.event_name == 'push' && 'auto' || 'false' }}
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build:
    name: Build ${{ matrix.image }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        image: [api, web]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Image names
        id: names
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          ghcr="ghcr.io/${OWNER,,}/open-sunsama-$IMAGE"
          names="$ghcr"
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            names="$names,docker.io/${DOCKERHUB_USERNAME,,}/open-sunsama-$IMAGE"
          fi
          {
            echo "ghcr=$ghcr"
            echo "names=$names"
            echo "platform-pair=${PLATFORM//\//-}"
          } >> "$GITHUB_OUTPUT"

      - name: Image labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.names.outputs.ghcr }}
          tags: ${{ env.IMAGE_TAGS }}
          flavor: latest=${{ env.LATEST }}

      - name: Log in to GitHub Container Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.PUSH == 'true' && env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      # Pushed by digest only; the merge job below tags the multi-platform image
      - name: Build
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.${{ matrix.image }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,"name=${{ steps.names.outputs.names }}",push-by-digest=true,name-canonical=true,push=${{ env.PUSH }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ steps.names.outputs.platform-pair }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ steps.names.outputs.platform-pair }}

      - name: Save digest
        if: env.PUSH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        if: env.PUSH == 'true'
        with:
          name: digests-${{ matrix.image }}-${{ steps.names.outputs.platform-pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish ${{ matrix.image }}
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        image: [api, web]
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - name: Image names
        id: names
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
        run: |
          ghcr="ghcr.io/${OWNER,,}/open-sunsama-$IMAGE"
          {
            echo "ghcr=$ghcr"
            echo "images<<EOF"
            echo "$ghcr"
            if [ -n "$DOCKERHUB_USERNAME" ]; then
              echo "docker.io/${DOCKERHUB_USERNAME,,}/open-sunsama-$IMAGE"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.names.outputs.images }}
          tags: ${{ env.IMAGE_TAGS }}
          flavor: latest=${{ env.LATEST }}

      - name: Create multi-platform manifests
        working-directory: ${{ runner.temp }}/digests
        env:
          GHCR_IMAGE: ${{ steps.names.outputs.ghcr }}
        run: |
          mapfile -t tags < <(jq -r '.tags[] | "-t", .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          sources=()
          for digest in *; do sources+=("$GHCR_IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"

      - name: Inspect
        env:
          IMAGE: ${{ steps.names.outputs.ghcr }}:${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "$IMAGE"
